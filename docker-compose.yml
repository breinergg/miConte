services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MICONTE_POSTGRES_USER:-miconte_user}
      POSTGRES_PASSWORD: ${MICONTE_POSTGRES_PASSWORD:?MICONTE_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${MICONTE_POSTGRES_DB:-miconte_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MICONTE_POSTGRES_USER:-miconte_user} -d ${MICONTE_POSTGRES_DB:-miconte_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MICONTE_API_PORT:-8000}:8000"
    environment:
      MICONTE_ENVIRONMENT: ${MICONTE_ENVIRONMENT:-production}
      MICONTE_DATABASE_URL: postgresql+psycopg://${MICONTE_POSTGRES_USER:-miconte_user}:${MICONTE_POSTGRES_PASSWORD}@db:5432/${MICONTE_POSTGRES_DB:-miconte_db}
      MICONTE_TOKEN_ENCRYPTION_KEY: ${MICONTE_TOKEN_ENCRYPTION_KEY:?MICONTE_TOKEN_ENCRYPTION_KEY is required}
      MICONTE_TOKEN_ENCRYPTION_KEY_ID: ${MICONTE_TOKEN_ENCRYPTION_KEY_ID:-k1}
      MICONTE_OAUTH_STATE_SECRET: ${MICONTE_OAUTH_STATE_SECRET:?MICONTE_OAUTH_STATE_SECRET is required}
      MICONTE_YOUTUBE_CLIENT_ID: ${MICONTE_YOUTUBE_CLIENT_ID:-}
      MICONTE_YOUTUBE_CLIENT_SECRET: ${MICONTE_YOUTUBE_CLIENT_SECRET:-}
      MICONTE_YOUTUBE_REDIRECT_URI: ${MICONTE_YOUTUBE_REDIRECT_URI:-}
      MICONTE_YOUTUBE_API_KEY: ${MICONTE_YOUTUBE_API_KEY:-}
      MICONTE_GOOGLE_LOGIN_CLIENT_ID: ${MICONTE_GOOGLE_LOGIN_CLIENT_ID:-}
      MICONTE_GOOGLE_LOGIN_CLIENT_SECRET: ${MICONTE_GOOGLE_LOGIN_CLIENT_SECRET:-}
      MICONTE_GOOGLE_LOGIN_REDIRECT_URI: ${MICONTE_GOOGLE_LOGIN_REDIRECT_URI:-}
      MICONTE_FRONTEND_URL: ${MICONTE_FRONTEND_URL:-http://localhost:4200}
      MICONTE_SESSION_COOKIE_NAME: ${MICONTE_SESSION_COOKIE_NAME:-miconte_session}
      MICONTE_SESSION_MAX_AGE_SECONDS: ${MICONTE_SESSION_MAX_AGE_SECONDS:-604800}
      MICONTE_CORS_ALLOW_ORIGINS: ${MICONTE_CORS_ALLOW_ORIGINS:-}
      MICONTE_SYNC_ENABLED: ${MICONTE_SYNC_ENABLED:-true}
      MICONTE_SYNC_INTERVAL_HOURS: ${MICONTE_SYNC_INTERVAL_HOURS:-24}
      MICONTE_SYNC_MAX_VIDEOS_PER_CHANNEL: ${MICONTE_SYNC_MAX_VIDEOS_PER_CHANNEL:-200}
      MICONTE_SYNC_ANALYTICS_DAYS: ${MICONTE_SYNC_ANALYTICS_DAYS:-30}
      MICONTE_ANALYTICS_REAL_DATA_ENABLED: "false"
      MICONTE_LLM_PROVIDER: ${MICONTE_LLM_PROVIDER:-none}
      MICONTE_LLM_TIMEOUT_SECONDS: ${MICONTE_LLM_TIMEOUT_SECONDS:-30.0}
      MICONTE_OLLAMA_BASE_URL: ${MICONTE_OLLAMA_BASE_URL:-http://localhost:11434}
      MICONTE_OLLAMA_MODEL: ${MICONTE_OLLAMA_MODEL:-llama3.2}
      MICONTE_EXTERNAL_LLM_BASE_URL: ${MICONTE_EXTERNAL_LLM_BASE_URL:-}
      MICONTE_EXTERNAL_LLM_API_KEY: ${MICONTE_EXTERNAL_LLM_API_KEY:-}
      MICONTE_EXTERNAL_LLM_MODEL: ${MICONTE_EXTERNAL_LLM_MODEL:-}

  # ── Alembic migrations (run-once helper) ────────────────────────────────────
  # Run explicitly with:
  #   docker compose run --rm migrate
  # This container exits after applying pending migrations.
  # It does NOT run automatically; production migrations must be reviewed
  # and triggered intentionally by the operator.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      MICONTE_DATABASE_URL: postgresql+psycopg://${MICONTE_POSTGRES_USER:-miconte_user}:${MICONTE_POSTGRES_PASSWORD}@db:5432/${MICONTE_POSTGRES_DB:-miconte_db}
      MICONTE_TOKEN_ENCRYPTION_KEY: ${MICONTE_TOKEN_ENCRYPTION_KEY:?MICONTE_TOKEN_ENCRYPTION_KEY is required}
      MICONTE_TOKEN_ENCRYPTION_KEY_ID: ${MICONTE_TOKEN_ENCRYPTION_KEY_ID:-k1}
      MICONTE_OAUTH_STATE_SECRET: ${MICONTE_OAUTH_STATE_SECRET:?MICONTE_OAUTH_STATE_SECRET is required}
    profiles:
      - migration

volumes:
  postgres_data:
