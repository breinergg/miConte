[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miconte"
version = "0.1.0"
description = "miConte — Plataforma de inteligencia de contenido (Fase 1: Entorno y persistencia inicial)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14.0,<2.0.0",
    "fastapi[standard]>=0.115.0,<1.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "mypy>=1.14.0,<2.0.0",
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/miconte"]

[tool.fastapi]
entrypoint = "miconte.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: pruebas que requieren conexión activa a PostgreSQL (miconte_db)",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["miconte"]
