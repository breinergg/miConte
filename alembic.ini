# Configuración de Alembic para miConte (miconte_db)

[alembic]
script_location = alembic
prepend_sys_path = . src
path_separator = os
version_path_separator = os

# La URL de conexión real se inyecta dinámicamente en `alembic/env.py`
# a partir de `MICONTE_DATABASE_URL` (vía `miconte.core.config.get_settings`).
sqlalchemy.url = postgresql+psycopg://localhost/miconte_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

